<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEON BANK | Admin Edition</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --neon: #00f2ff; --bg: #0a0b10; --card-bg: #161b22; --admin-red: #ff4444; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; }
        .main-card { background: var(--card-bg); border: 1px solid #30363d; border-radius: 20px; }
        .bank-card { background: linear-gradient(135deg, #1d4ed8, #7e22ce); border-radius: 15px; padding: 25px; }
        .admin-panel { border: 2px dashed var(--admin-red); background: rgba(255, 68, 68, 0.05); padding: 20px; border-radius: 20px; margin-top: 20px; }
        .hidden { display: none !important; }
        .btn-neon { background: var(--neon); color: black; font-weight: bold; border-radius: 10px; border: none; padding: 10px 20px; }
        .form-control { background: #0d1117; border: 1px solid #30363d; color: white; }
    </style>
</head>
<body class="container py-4">

    <div id="authBox" class="mx-auto mt-5 hidden" style="max-width: 400px;">
        <div class="main-card p-5 text-center">
            <h1 style="color: var(--neon); font-weight: 900;">NEON BANK</h1>
            <input type="text" id="user" class="form-control mb-3" placeholder="Нікнейм">
            <input type="password" id="pass" class="form-control mb-4" placeholder="Пароль">
            <button onclick="login()" class="btn btn-primary w-100 mb-2">Увійти</button>
            <button onclick="register()" class="btn btn-link w-100 text-info text-decoration-none">Реєстрація</button>
        </div>
    </div>

    <div id="mainBox" class="hidden">
        <div class="row g-4">
            <div class="col-lg-4">
                <div class="bank-card mb-4">
                    <p class="small mb-4 fw-bold">ADMIN EDITION</p>
                    <h5 id="cardNum" style="letter-spacing: 2px;">**** **** **** ****</h5>
                    <h2 class="mt-4" id="balanceDisplay">$0.00</h2>
                </div>
                <button class="btn btn-neon w-100 py-4 mb-3" onclick="doClick()">КЛІКАТИ ГРОШІ</button>
                <div class="main-card p-3" id="leaderboard"></div>
            </div>

            <div class="col-lg-8">
                <div id="adminPanel" class="adminPanel hidden">
                    <h4 style="color: var(--admin-red);">🛡️ Адмін-Панель (Тільки для тебе)</h4>
                    <div class="row g-2 mt-3">
                        <div class="col-md-6">
                            <label class="small">Дати гроші (карта):</label>
                            <input type="text" id="admTarget" class="form-control mb-2" placeholder="Номер карти">
                            <input type="number" id="admAmount" class="form-control mb-2" placeholder="Сума">
                            <button onclick="adminGive()" class="btn btn-danger btn-sm w-100">Нарахувати</button>
                        </div>
                        <div class="col-md-6">
                            <label class="small">Змінити карту:</label>
                            <input type="text" id="admOld" class="form-control mb-2" placeholder="Старий номер">
                            <input type="text" id="admNew" class="form-control mb-2" placeholder="Новий номер (напр. 7777)">
                            <button onclick="adminSetCard()" class="btn btn-warning btn-sm w-100">Змінити номер</button>
                        </div>
                        <div class="col-12 mt-3 text-center">
                            <button onclick="adminShowUsers()" class="btn btn-outline-info btn-sm">Показати всіх юзерів та паролі</button>
                        </div>
                    </div>
                </div>

                <div class="main-card p-4 mt-4">
                    <h6>Переказ коштів</h6>
                    <input type="text" id="target" class="form-control mb-2" placeholder="Карта отримувача">
                    <input type="number" id="amount" class="form-control mb-2" placeholder="Сума">
                    <button onclick="sendMoney()" class="btn btn-warning w-100">Відправити</button>
                </div>
                <button onclick="logout()" class="btn btn-link text-danger mt-3">Вийти</button>
            </div>
        </div>
    </div>

    <script>
        async function req(url, body) {
            const res = await fetch(url, {
                method: body ? 'POST' : 'GET',
                headers: {'Content-Type': 'application/json'},
                body: body ? JSON.stringify(body) : null
            });
            return res.json();
        }

        window.onload = async () => {
            const data = await req('/api/me');
            if (data && !data.error) init(data); else authBox.classList.remove('hidden');
        };

        async function login() {
            const res = await req('/api/login', {username: user.value, password: pass.value});
            if (res.success) location.reload(); else alert(res.error);
        }

        async function register() {
            const res = await req('/api/register', {username: user.value, password: pass.value});
            if (res.success) alert('Ок!'); else alert(res.error);
        }

        function logout() {
            document.cookie = "token=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
            location.reload();
        }

        async function init(user) {
            authBox.classList.add('hidden');
            mainBox.classList.remove('hidden');
            if(user.isAdmin) adminPanel.classList.remove('hidden');
            updateData();
        }

        async function doClick() {
            const res = await req('/api/click', {});
            balanceDisplay.innerText = '$' + res.balance.toFixed(2);
        }

        async function updateData() {
            const data = await req('/api/me');
            cardNum.innerText = data.card_number;
            balanceDisplay.innerText = '$' + data.balance.toFixed(2);
            
            const leads = await req('/api/leaderboard');
            leaderboard.innerHTML = '<h6>Топ гравців</h6>' + leads.map(l => `<div class="small">${l.username}: $${l.balance.toFixed(0)}</div>`).join('');
        }

        // ФУНКЦІЇ АДМІНА
        async function adminGive() {
            await req('/api/admin/give', {targetCard: admTarget.value, amount: admAmount.value});
            alert('Гроші видано!');
            updateData();
        }

        async function adminSetCard() {
            const res = await req('/api/admin/set-card', {oldCard: admOld.value, newCard: admNew.value});
            if(res.success) alert('Номер змінено!'); else alert(res.error);
            updateData();
        }

        async function adminShowUsers() {
            const users = await req('/api/admin/users');
            let list = users.map(u => `Юзер: ${u.username} | Пароль: ${u.raw_password} | Карта: ${u.card_number}`).join('\n');
            alert(list);
            console.log(users);
        }

        setInterval(() => { if(!mainBox.classList.contains('hidden')) { req('/api/collect', {}); updateData(); } }, 5000);
    </script>
</body>
</html>
