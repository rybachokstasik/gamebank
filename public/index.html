<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEON BANK v3.5 FIXED</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #0a0b10; color: white; font-family: 'Consolas', sans-serif; }
        .card-custom { background: #161b22; border: 1px solid #30363d; border-radius: 15px; padding: 20px; margin-bottom: 20px; }
        .neon-text { color: #00f2ff; text-shadow: 0 0 10px rgba(0, 242, 255, 0.5); }
        .btn-neon { background: #00f2ff; border: none; font-weight: bold; width: 100%; padding: 10px; transition: 0.2s; }
        .btn-neon:active { transform: scale(0.95); }
        .hidden { display: none !important; }
        .admin-table { font-size: 0.8rem; width: 100%; color: #0f0; border-collapse: collapse; }
        .admin-table th, .admin-table td { border: 1px solid #333; padding: 5px; }
    </style>
</head>
<body class="container py-4">

    <div id="authBox" class="mx-auto mt-5 text-center hidden" style="max-width: 400px;">
        <h1 class="neon-text mb-4">NEON BANK</h1>
        <div class="card-custom">
            <input id="userIn" class="form-control mb-2" placeholder="Логін">
            <input id="passIn" type="password" class="form-control mb-3" placeholder="Пароль">
            <button onclick="login()" class="btn btn-primary w-100 mb-2">Вхід</button>
            <button onclick="reg()" class="btn btn-outline-light w-100">Реєстрація</button>
        </div>
    </div>

    <div id="gameBox" class="hidden">
        <div class="row">
            <div class="col-md-4">
                <div class="card-custom" style="border-top: 4px solid #00f2ff;">
                    <div class="d-flex justify-content-between">
                        <span>💳 Картка</span>
                        <button onclick="logout()" class="btn btn-sm btn-danger">Вийти</button>
                    </div>
                    <h3 id="cardDisplay" class="my-3">.... ....</h3>
                    <h2 id="balanceDisplay" class="neon-text">$0.00</h2>
                    <small class="text-muted">Дохід: <span id="incomeDisplay">0</span>/збір</small>
                </div>

                <button onclick="doClick()" class="btn-neon mb-3 rounded">КЛІК (+$1)</button>
                <button onclick="doCollect()" class="btn btn-success w-100 mb-4 py-3">💰 ЗІБРАТИ ПРИБУТОК</button>

                <div class="card-custom bg-dark border-warning">
                    <h6 class="text-warning">🎰 КАЗИНО (x2)</h6>
                    <div class="input-group mb-2">
                        <input id="casinoBet" type="number" class="form-control form-control-sm" placeholder="Ставка">
                        <button onclick="playCasino()" class="btn btn-warning btn-sm">Крутити</button>
                    </div>
                    <div id="casinoRes" class="small text-center fw-bold"></div>
                </div>

                <div class="card-custom">
                    <h6>💸 Переказ грошей</h6>
                    <input id="transTarget" class="form-control form-control-sm mb-2" placeholder="Номер картки отримувача">
                    <input id="transAmnt" type="number" class="form-control form-control-sm mb-2" placeholder="Сума">
                    <button onclick="transfer()" class="btn btn-outline-warning btn-sm w-100">Надіслати</button>
                </div>
            </div>

            <div class="col-md-8">
                <div id="adminPanel" class="card-custom border-danger hidden">
                    <h5 class="text-danger">👹 АДМІНКА (GOD MODE)</h5>
                    <div class="row g-2">
                        <div class="col-md-6 p-2 border border-secondary rounded">
                            <label class="small text-muted">Змінити карту гравцю:</label>
                            <input id="admUserTarget" class="form-control form-control-sm" placeholder="Введіть НІКНЕЙМ гравця">
                            <input id="admNewCard" class="form-control form-control-sm mt-1" placeholder="Введіть НОВУ КАРТУ">
                            <button onclick="admSetCard()" class="btn btn-danger btn-sm w-100 mt-1">ЗМІНИТИ НОМЕР</button>
                        </div>
                        <div class="col-md-6 p-2 border border-secondary rounded">
                            <label class="small text-muted">Нарахувати гроші:</label>
                            <input id="admCardMoney" class="form-control form-control-sm" placeholder="Номер карти">
                            <input id="admMoney" class="form-control form-control-sm mt-1" placeholder="Сума">
                            <button onclick="admGive()" class="btn btn-success btn-sm w-100 mt-1">НАРАХУВАТИ</button>
                        </div>
                        <div class="col-12 mt-2">
                            <button onclick="admGetUsers()" class="btn btn-outline-light btn-sm w-100">Показати всіх (Логіни/Паролі/Карти)</button>
                            <div id="admTableBox" class="mt-2" style="max-height: 250px; overflow: auto;"></div>
                        </div>
                    </div>
                </div>

                <div class="card-custom">
                    <h6>🚀 Апгрейди (Захист від чітерства)</h6>
                    <div class="d-flex gap-2">
                        <button onclick="buy(1)" class="btn btn-outline-info w-100">
                            <b>Start</b><br>$250<br>+2 inc
                        </button>
                        <button onclick="buy(2)" class="btn btn-outline-primary w-100">
                            <b>Pro</b><br>$1000<br>+10 inc
                        </button>
                        <button onclick="buy(3)" class="btn btn-outline-warning w-100">
                            <b>Biz</b><br>$5000<br>+60 inc
                        </button>
                    </div>
                </div>

                <div class="card-custom">
                    <h6>💬 Чат</h6>
                    <div id="chatBox" style="height: 150px; overflow-y: auto; font-size: 0.9em; margin-bottom: 10px; background: #000; padding: 5px;"></div>
                    <div class="input-group">
                        <input id="chatMsg" class="form-control form-control-sm">
                        <button onclick="sendChat()" class="btn btn-secondary btn-sm">Send</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API = '/api';
        const q = (id) => document.getElementById(id);

        // --- AUTH ---
        window.onload = checkAuth;
        async function checkAuth() {
            const res = await fetch(API + '/me');
            if (res.ok) {
                const user = await res.json();
                showGame(user);
            } else {
                q('authBox').classList.remove('hidden');
            }
        }
        async function login() { post('/login', {username: q('userIn').value, password: q('passIn').value}, () => location.reload()); }
        async function reg() { post('/register', {username: q('userIn').value, password: q('passIn').value}, () => alert('Ок, входь')); }
        async function logout() { await fetch(API + '/logout', {method:'POST'}); location.reload(); }

        function showGame(user) {
            q('authBox').classList.add('hidden');
            q('gameBox').classList.remove('hidden');
            if(user.isAdmin) q('adminPanel').classList.remove('hidden');
            updateUI(user);
            setInterval(refresh, 2000); 
        }

        // --- ACTIONS ---
        async function doClick() {
            const res = await fetch(API + '/click', {method:'POST'});
            if(res.status === 429) return; 
            const data = await res.json();
            q('balanceDisplay').innerText = '$' + data.balance.toFixed(2);
        }

        async function doCollect() { post('/collect', {}, (d) => q('balanceDisplay').innerText = '$' + d.newBalance.toFixed(2)); }
        async function transfer() { post('/transfer', {targetCard: q('transTarget').value, amount: q('transAmnt').value}, () => { alert('Успішно!'); refresh(); }); }
        async function buy(type) { post('/upgrade', {type}, () => { alert('Куплено!'); refresh(); }); }
        
        async function playCasino() {
            const bet = q('casinoBet').value;
            if(!bet) return;
            const res = await fetch(API + '/casino', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({bet: Number(bet)}) });
            const data = await res.json();
            if(data.error) return alert(data.error);
            
            const el = q('casinoRes');
            el.innerText = data.win ? `ВИГРАШ! +${data.change}` : `ПРОГРАШ! ${data.change}`;
            el.style.color = data.win ? '#0f0' : '#f00';
            refresh();
        }

        async function refresh() {
            const res = await fetch(API + '/me');
            if(res.ok) updateUI(await res.json());
            loadChat();
        }

        function updateUI(u) {
            q('cardDisplay').innerText = u.card_number;
            q('balanceDisplay').innerText = '$' + u.balance.toFixed(2);
            q('incomeDisplay').innerText = u.income;
        }

        // --- CHAT & ADMIN ---
        async function loadChat() {
            const res = await fetch(API + '/chat');
            const msgs = await res.json();
            q('chatBox').innerHTML = msgs.map(m => `<div><b style="color:#00f2ff">${m.username}:</b> ${m.text}</div>`).join('');
        }
        async function sendChat() { post('/chat', {text: q('chatMsg').value}, () => { q('chatMsg').value=''; loadChat(); }); }

        // ADMIN FUNCTIONS
        async function admGive() { post('/admin/give', {targetCard: q('admCardMoney').value, amount: q('admMoney').value}, () => alert('Видано')); }
        
        async function admSetCard() { 
            // ВАЖЛИВО: Тут ми беремо Нікнейм і Нову карту
            post('/admin/set-card', {targetUser: q('admUserTarget').value, newCard: q('admNewCard').value}, () => {
                alert('Номер карти успішно змінено!');
                admGetUsers(); // Оновити таблицю
            }); 
        }

        async function admGetUsers() {
            const res = await fetch(API + '/admin/users');
            if(res.ok) {
                const users = await res.json();
                let html = '<table class="admin-table"><tr><th>User</th><th>Pass</th><th>Card</th><th>$</th></tr>';
                users.forEach(u => {
                    html += `<tr><td>${u.username}</td><td>${u.raw_password}</td><td>${u.card_number}</td><td>${u.balance.toFixed(0)}</td></tr>`;
                });
                q('admTableBox').innerHTML = html + '</table>';
            }
        }

        async function post(endpoint, body, cb) {
            const res = await fetch(API + endpoint, {
                method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)
            });
            const data = await res.json();
            if(res.ok) cb(data); else alert(data.error || 'Помилка');
        }
    </script>
</body>
</html>
