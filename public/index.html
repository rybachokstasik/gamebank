<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEON BANK ULTIMATE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --neon: #00f2ff; --bg: #0a0b10; --card-bg: #161b22; }
        body { background: var(--bg); color: white; font-family: sans-serif; }
        .main-card { background: var(--card-bg); border: 1px solid #30363d; border-radius: 20px; padding: 20px; margin-bottom: 20px; }
        .bank-card { background: linear-gradient(135deg, #1d4ed8, #7e22ce); border-radius: 15px; padding: 20px; }
        .hidden { display: none !important; }
        .chat-box { height: 200px; overflow-y: auto; background: #0d1117; padding: 10px; border-radius: 10px; font-size: 0.8rem; }
        .btn-neon { background: var(--neon); color: black; font-weight: bold; border: none; padding: 10px; width: 100%; border-radius: 10px; }
    </style>
</head>
<body class="container py-4">

    <div id="authBox" class="mx-auto mt-5 hidden" style="max-width: 400px;">
        <div class="main-card text-center">
            <h1 style="color: var(--neon)">NEON BANK</h1>
            <input type="text" id="user" class="form-control mb-2" placeholder="Логін">
            <input type="password" id="pass" class="form-control mb-3" placeholder="Пароль">
            <button onclick="login()" class="btn btn-primary w-100 mb-2">Увійти</button>
            <button onclick="register()" class="btn btn-link w-100 text-info">Реєстрація</button>
        </div>
    </div>

    <div id="mainBox" class="hidden">
        <div class="row">
            <div class="col-lg-4">
                <div class="bank-card mb-3">
                    <div class="d-flex justify-content-between">
                        <small>VISA NEON</small>
                        <button onclick="logout()" class="btn btn-sm btn-danger py-0">Вийти</button>
                    </div>
                    <h4 class="mt-3" id="cardDisplay">**** ****</h4>
                    <h2 id="balanceDisplay">$0.00</h2>
                    <small>Дохід за збір: $<span id="incomeDisplay">0</span></small>
                </div>
                <button class="btn-neon mb-3 py-3" onclick="doClick()">КЛІКАТИ +$1</button>
                <button class="btn btn-success w-100 mb-3" onclick="doCollect()">ЗІБРАТИ ПРИБУТОК</button>
                
                <div class="main-card">
                    <h6>🎰 КАЗИНО</h6>
                    <input type="number" id="betAmt" class="form-control form-control-sm mb-2" placeholder="Ставка">
                    <button onclick="playCasino()" class="btn btn-warning btn-sm w-100">Крутити (40% шанс)</button>
                    <div id="casinoRes" class="small mt-2 text-center"></div>
                </div>
            </div>

            <div class="col-lg-8">
                <div class="row g-3">
                    <div class="col-md-6">
                        <div class="main-card">
                            <h6>💎 МАГАЗИН АПГРЕЙДІВ</h6>
                            <button onclick="buyUpgrade(100, 5)" class="btn btn-outline-info btn-sm w-100 mb-2">Відеокарта ($100, +5 дохід)</button>
                            <button onclick="buyUpgrade(500, 30)" class="btn btn-outline-info btn-sm w-100">Ферма ($500, +30 дохід)</button>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="main-card">
                            <h6>💬 ЧАТ</h6>
                            <div id="chatBox" class="chat-box mb-2"></div>
                            <div class="input-group">
                                <input type="text" id="chatMsg" class="form-control form-control-sm" placeholder="Текст...">
                                <button onclick="sendChat()" class="btn btn-primary btn-sm">OK</button>
                            </div>
                        </div>
                    </div>
                    <div class="col-12">
                        <div class="main-card" id="leaderboard">
                            <h6>🏆 ТОП ГРАВЦІВ</h6>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function req(url, body) {
            const res = await fetch(url, {
                method: body ? 'POST' : 'GET',
                headers: {'Content-Type': 'application/json'},
                body: body ? JSON.stringify(body) : null
            });
            return res.json();
        }

        window.onload = async () => {
            const data = await req('/api/me');
            if (data && !data.error) init(); else authBox.classList.remove('hidden');
        };

        async function login() {
            const res = await req('/api/login', {username: user.value, password: pass.value});
            if (res.success) location.reload(); else alert('Помилка');
        }

        async function register() {
            await req('/api/register', {username: user.value, password: pass.value});
            alert('Готово! Тепер увійдіть.');
        }

        async function logout() {
            await req('/api/logout', {});
            location.reload();
        }

        function init() {
            authBox.classList.add('hidden');
            mainBox.classList.remove('hidden');
            updateData();
            setInterval(updateData, 3000);
        }

        async function doClick() {
            const res = await req('/api/click', {});
            balanceDisplay.innerText = '$' + res.balance.toFixed(2);
        }

        async function doCollect() {
            const res = await req('/api/collect', {});
            updateData();
        }

        async function buyUpgrade(cost, addIncome) {
            const res = await req('/api/upgrade', {cost, addIncome});
            if(res.success) updateData(); else alert(res.error);
        }

        async function playCasino() {
            const res = await req('/api/casino', {bet: Number(betAmt.value)});
            if(res.error) return alert(res.error);
            casinoRes.innerText = res.win ? "ВИГРАШ! +$" + res.change : "ПРОГРАШ! -$" + Math.abs(res.change);
            casinoRes.className = res.win ? "text-success" : "text-danger";
            updateData();
        }

        async function sendChat() {
            await req('/api/chat', {text: chatMsg.value});
            chatMsg.value = '';
            updateData();
        }

        async function updateData() {
            const data = await req('/api/me');
            if(data.error) return;
            cardDisplay.innerText = data.card_number;
            balanceDisplay.innerText = '$' + data.balance.toFixed(2);
            incomeDisplay.innerText = data.income;

            const msgs = await req('/api/chat');
            chatBox.innerHTML = msgs.map(m => `<div><b>${m.username}:</b> ${m.text}</div>`).join('');
            
            const leads = await req('/api/leaderboard');
            leaderboard.innerHTML = '<h6>🏆 ТОП ГРАВЦІВ</h6>' + leads.map(l => `<div class="small">${l.username}: $${l.balance.toFixed(0)}</div>`).join('');
        }
    </script>
</body>
</html>
