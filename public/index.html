<div id="game" style="display:none">
    <div class="header">
        <h2 id="user-display">Вітаємо</h2>
        <button onclick="logout()" style="background:red">Вийти</button>
    </div>

    <div class="card">
        <p>Ваша карта: <b id="card-num">****</b></p>
        <h3>Баланс: <span id="balance">0</span> 🪙</h3>
        <p>Прибуток за збір: <span id="income">0</span> 🪙</p>
        <button class="btn-main" onclick="clickMoney()">КЛІК!</button>
        <button class="btn-main" style="background:#28a745" onclick="collectMoney()">ЗІБРАТИ ПРИБУТОК</button>
    </div>

    <div class="card" style="background: #2c3e50; color: white;">
        <h3>🎰 КАЗИНО 🎰</h3>
        <input type="number" id="bet-amount" placeholder="Ставка">
        <button onclick="playCasino()" style="background: #f1c40f; color: black;">Крутити!</button>
        <p id="casino-result"></p>
    </div>

    <div class="card">
        <h3>🚀 Магазин Апгрейдів</h3>
        <div style="display:flex; flex-direction:column; gap:10px;">
            <button onclick="buyUpgrade(100, 5)">Купити Відеокарту (Ціна: 100, +5 до збору)</button>
            <button onclick="buyUpgrade(500, 30)">Купити Ферму (Ціна: 500, +30 до збору)</button>
            <button onclick="buyUpgrade(2000, 150)">Купити Банк (Ціна: 2000, +150 до збору)</button>
        </div>
    </div>

    </div>
